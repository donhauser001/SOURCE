services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: source-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source_dev_password
      POSTGRES_DB: source
    ports:
      - '5434:5432' # 本机 5434 -> 容器 5432（避免与本机 PG 冲突）
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U source -d source' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: source_postgres_data
